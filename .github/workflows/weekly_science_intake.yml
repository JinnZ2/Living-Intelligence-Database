# ADOPTED 2026-11-24 by the owner's yes (PR #30). Copied from
# audit/2026-11-24/intake/weekly_science_intake.yml; only this header differs.
# Scheduled runs start only once this file is on the default branch (main).
# Governed by the DECLARED.json amendment "weekly intake (source pass, stage 0)".
#
# The pull-request step needs the repository setting
# "Allow GitHub Actions to create and approve pull requests" (Settings > Actions > General).
# Without it that step fails loudly; the snapshots are still uploaded as an artifact.
#
# What it does, weekly: fetch newly indexed works from Europe PMC for the queries in
# intake_queries.json, save the raw bytes with sha256, filter and list candidates offline,
# generate rule-based hypothesis stubs, and open a pull request for a person to review.
# It never merges, never writes ontology/ or registry/, and fails loudly on any NOT_RUN.
#
# Note 2026-11-24 (first dispatched run, 45514015851): three changes from the audit copy.
#  1. validation/fixtures/run_fixtures.py exits 1 on NOT_RUN, and fixture F6 is NOT_RUN without
#     jsonschema; the runner has none. A step now installs it, as pipeline.sh already does.
#  2. upload-artifact ran with an empty path when the fetch step was skipped; it is now guarded.
#  3. The repo setting blocks Actions from opening pull requests. If `gh pr create` fails, the
#     step now opens an issue linking the pushed branch instead, so a person still reviews and
#     merges. The branch is pushed either way. Nothing here merges.
name: weekly-science-intake

on:
  schedule:
    - cron: "17 11 * * 1"   # Mondays 11:17 UTC
  workflow_dispatch:
    inputs:
      since: { description: "YYYY-MM-DD (default: until minus 7 days)", required: false }
      until: { description: "YYYY-MM-DD (default: today)", required: false }

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: weekly-science-intake
  cancel-in-progress: false

env:
  INTAKE_DIR: audit/2026-11-24/intake
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }

      # The repository's own validator (scripts/build_index.py, fixture F6) needs jsonschema,
      # the same dependency pipeline.sh installs.
      - name: Install jsonschema
        run: python3 -m pip install --quiet jsonschema

      # Offline instruments first. Any failure stops the run before the network is used.
      - name: Self-tests (offline)
        run: |
          set -euo pipefail
          python3 audit/2026-11-24/deviation/deviation_extract.py --selftest
          python3 audit/2026-11-24/biosphere/biosphere_candidates.py --selftest
          python3 "$INTAKE_DIR/weekly_intake.py" --selftest
          python3 validation/fixtures/run_fixtures.py

      # The one networked stage. Exit 3 means a query was NOT_RUN: the job fails after the
      # snapshots are uploaded, and no pull request is opened from an incomplete run.
      - name: Fetch, filter, list candidates, generate hypothesis stubs
        id: run
        run: |
          set -uo pipefail
          UNTIL="${{ inputs.until }}"; UNTIL="${UNTIL:-$(date -u +%F)}"
          SINCE="${{ inputs.since }}"
          OUT="intake/weekly/$UNTIL"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          echo "until=$UNTIL" >> "$GITHUB_OUTPUT"
          ARGS=(fetch --repo . --queries "$INTAKE_DIR/intake_queries.json" --out "$OUT" --until "$UNTIL")
          [ -n "$SINCE" ] && ARGS+=(--since "$SINCE")
          python3 "$INTAKE_DIR/weekly_intake.py" "${ARGS[@]}"
          echo "code=$?" >> "$GITHUB_OUTPUT"

      # Replay: the offline stages must reproduce the same bytes from the saved snapshots.
      - name: Replay from snapshots
        run: |
          set -euo pipefail
          OUT="${{ steps.run.outputs.out }}"
          python3 "$INTAKE_DIR/weekly_intake.py" offline --repo . --queries "$INTAKE_DIR/intake_queries.json" \
            --snapshots "$OUT/snapshots" --out /tmp/replay || true
          cmp "$OUT/intake.json" /tmp/replay/intake.json
          cmp "$OUT/intake.md" /tmp/replay/intake.md

      - uses: actions/upload-artifact@v7
        if: always() && steps.run.outputs.out != ''
        with:
          name: intake-${{ steps.run.outputs.until }}
          path: ${{ steps.run.outputs.out }}

      - name: Fail on NOT_RUN or error
        if: steps.run.outputs.code != '0'
        run: |
          echo "intake exited ${{ steps.run.outputs.code }}; see intake.md NOT_RUN list"; exit 1

      # Optional reading slot. Declared, not implemented. Runs only if the owner sets the
      # repository variable INTAKE_LLM_ENABLED=true and a secret. Whatever fills it must
      # write model name, prompt sha256 and reading_state MACHINE_READ_NOT_REVIEWED, and
      # must not write claim_support.
      - name: Optional machine reading (off by default)
        if: vars.INTAKE_LLM_ENABLED == 'true'
        run: |
          echo "NOT_IMPLEMENTED: no reader is wired in this proposal"; exit 1

      - name: Open a pull request for review (never merged by this workflow)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          OUT="${{ steps.run.outputs.out }}"; UNTIL="${{ steps.run.outputs.until }}"
          BR="intake/weekly-$UNTIL"
          git config user.name  "lid-intake-bot"
          git config user.email "lid-intake-bot@users.noreply.github.com"
          git switch -c "$BR"
          git add "$OUT"
          git commit -m "intake: weekly candidates to $UNTIL (PROPOSED, unreviewed)"
          git push origin "$BR"
          TITLE="Weekly science intake to $UNTIL (PROPOSED, unreviewed)"
          if gh pr create --base main --head "$BR" --title "$TITLE" --body-file "$OUT/intake.md" --label intake \
             || gh pr create --base main --head "$BR" --title "$TITLE" --body-file "$OUT/intake.md"; then
            exit 0
          fi
          echo "::warning::pull request creation refused (repo setting); opening an issue that links the branch"
          {
            echo "Branch \`$BR\` was pushed; Actions is not permitted to open pull requests in this repository."
            echo "Open the pull request by hand to review: https://github.com/$REPO/compare/main...$BR"
            echo
            echo "Nothing has been merged. Everything below is PROPOSED and unreviewed."
            echo
            cat "$OUT/intake.md"
          } > /tmp/issue_body.md
          gh issue create --title "$TITLE" --body-file /tmp/issue_body.md --label intake \
            || gh issue create --title "$TITLE" --body-file /tmp/issue_body.md
